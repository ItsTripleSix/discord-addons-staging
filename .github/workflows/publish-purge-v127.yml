name: Publish Purge Tools v1.2.7 flat

# One-shot staging publisher. Remove after v1.2.7 is committed.
on:
  push:
    paths:
      - .github/workflows/publish-purge-v127.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize pinned sources
        run: |
          git show 10bcce8814bde3565fa3f6074b860c0f926df6cc:plugins/purge-tools/index.js > /tmp/purge-tools-base122.js
          git show d5eb9a6f5982b68146c8c1f6d53d0de7a3df2cf3:plugins/purge-tools/index.js > /tmp/purge-tools-base121.js
          git show f193a94e67e9fc3b0a8c8b0a67bb87cc5e3689af:plugins/purge-tools/index.js > /tmp/purge-tools-base120.js
          git show 9528af7b82f442173805b5db3fc9a061c1a3b857:plugins/purge-tools/index.js > /tmp/purge-tools-base117.js
          git clone --depth 1 https://github.com/ItsTripleSix/discord-addons.git /tmp/discord-addons-stable
          cp /tmp/discord-addons-stable/plugins/purge-tools/index.js /tmp/purge-tools-stable-core.js
          test "$(git hash-object /tmp/purge-tools-stable-core.js)" = "3fc64ece4c836765f0c93299088ab410923f06d1"

      - name: Build and validate flattened v1.2.7
        run: |
          node scripts/purge-tools-smoke.cjs plugins/purge-tools/index.js /tmp/purge-tools-base122.js /tmp/purge-tools-base121.js /tmp/purge-tools-base120.js /tmp/purge-tools-base117.js /tmp/purge-tools-stable-core.js
          test -s /tmp/purge-tools-v127-flat.js
          node --check /tmp/purge-tools-v127-flat.js
          grep -q 'const PLUGIN_VERSION = "1.2.7-shiggy";' /tmp/purge-tools-v127-flat.js
          ! grep -q 'shiggyPurgeWrapperBase' /tmp/purge-tools-v127-flat.js

      - name: Install flattened plugin and update manifests
        run: |
          cp /tmp/purge-tools-v127-flat.js plugins/purge-tools/index.js
          cp /tmp/purge-tools-v127-flat.js clients/shiggycord/plugins/purge-tools/index.js
          HASH="$(git hash-object plugins/purge-tools/index.js)"
          export HASH
          python3 - <<'PY'
          import json, os
          paths = [
              "plugins/purge-tools/manifest.json",
              "clients/shiggycord/plugins/purge-tools/manifest.json",
          ]
          for path in paths:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              data["description"] = "ShiggyCord Purge Tools v1.2.7 with flattened runtime, conservative shared pacing, 30/min shared cap, readable progress/status UI, confidence ETA, persistent target drafts, local reports, media protection, and account-scoped resume checkpoints."
              data["hash"] = os.environ["HASH"]
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write("\n")
          PY
          cmp plugins/purge-tools/index.js clients/shiggycord/plugins/purge-tools/index.js
          cmp plugins/purge-tools/manifest.json clients/shiggycord/plugins/purge-tools/manifest.json
          test "$(python3 -c 'import json; print(json.load(open("plugins/purge-tools/manifest.json"))["hash"])')" = "$HASH"

      - name: Commit flattened v1.2.7
        run: |
          git config user.name "ItsTripleSix"
          git config user.email "onlytriplesix@protonmail.com"
          git add plugins/purge-tools/index.js plugins/purge-tools/manifest.json clients/shiggycord/plugins/purge-tools/index.js clients/shiggycord/plugins/purge-tools/manifest.json
          git diff --cached --check
          git commit -m "Purge Tools v1.2.7 flattened runtime"
          git push origin HEAD:main
