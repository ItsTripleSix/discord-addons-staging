name: Publish Purge Tools v1.2.8

on:
  push:
    paths:
      - .github/workflows/publish-purge-v128.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v1.2.7 baseline
        run: |
          test "$(git hash-object plugins/purge-tools/index.js)" = "abc503c9e0ce8a9fe4ca4f44a49d4615eb23e3ba"
          cmp plugins/purge-tools/index.js clients/shiggycord/plugins/purge-tools/index.js
          grep -q 'const PLUGIN_VERSION = "1.2.7-shiggy";' plugins/purge-tools/index.js

      - name: Patch v1.2.8 transient recovery and failure accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("plugins/purge-tools/index.js"),
              Path("clients/shiggycord/plugins/purge-tools/index.js"),
          ]

          def once(text, before, after, label):
              n = text.count(before)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return text.replace(before, after, 1)

          for path in paths:
              s = path.read_text(encoding="utf-8")

              s = once(s,
                  '  const VERIFY_PASSES = 3;\n  const PLUGIN_VERSION = "1.2.7-shiggy";',
                  '  const VERIFY_PASSES = 3;\n  const TRANSIENT_RETRIES = 2;\n  const TRANSIENT_RETRY_BASE_MS = 1000;\n  const PLUGIN_VERSION = "1.2.8-shiggy";',
                  "version/constants")

              s = once(s,
                  '    cleanup: null,\n  };',
                  '    cleanup: null,\n    unresolvedFailures: new Set(),\n  };',
                  "runtime unresolved failures")

              s = once(s,
                  '      failed: 0,\n      waitMs: 0,',
                  '      failed: 0,\n      recoveredFailures: 0,\n      waitMs: 0,',
                  "progress recovered failures")

              s = once(s,
                  '      this.rateLimits = 0;\n      this.headersSeen = 0;',
                  '      this.rateLimits = 0;\n      this.transientErrors = 0;\n      this.recoveredTransientRequests = 0;\n      this.headersSeen = 0;',
                  "metrics transient counters")

              s = once(s,
                  '      this.waitTotals = { pacing: 0, cooldown: 0, indexing: 0 };',
                  '      this.waitTotals = { pacing: 0, cooldown: 0, indexing: 0, transient: 0 };',
                  "transient wait bucket")

              s = once(s,
                  '        responses: { ...this.responses }, operations: { ...this.routes }, rate_limits: this.rateLimits,\n        observed_limits: clone(this.observedLimits),',
                  '        responses: { ...this.responses }, operations: { ...this.routes }, rate_limits: this.rateLimits,\n        transient_errors: this.transientErrors, recovered_transient_requests: this.recoveredTransientRequests,\n        unresolved_failures: progress.failed, recovered_failures: progress.recoveredFailures ?? 0,\n        observed_limits: clone(this.observedLimits),',
                  "report transient fields")

              s = once(s,
                  '    async runRequest(identity, kind, fn) {\n      let lane = this.lane(identity, kind);\n      const resource = this.resource(identity);\n      for (;;) {',
                  '    async runRequest(identity, kind, fn) {\n      let lane = this.lane(identity, kind);\n      const resource = this.resource(identity);\n      let transientAttempts = 0;\n      for (;;) {',
                  "request transient counter")

              s = once(s,
                  '          if (status !== 429) { this.persist(); throw error; }\n          const ms = pacingRetry(error);',
                  '          const transient = status >= 500 && status <= 599;\n          if (transient) this.metrics.transientErrors++;\n          if (status !== 429) {\n            if (transient && transientAttempts < TRANSIENT_RETRIES) {\n              transientAttempts++;\n              const retryMs = TRANSIENT_RETRY_BASE_MS * (2 ** (transientAttempts - 1));\n              this.persist();\n              this.metrics.beginWait("transient", Date.now() + retryMs);\n              setProgress({ status: `Discord returned ${status}; retrying automatically (${transientAttempts}/${TRANSIENT_RETRIES})...`, waitMs: retryMs });\n              await this.control.wait(retryMs);\n              this.metrics.endWait();\n              continue;\n            }\n            this.persist();\n            throw error;\n          }\n          const ms = pacingRetry(error);',
                  "central 5xx retry")

              s = once(s,
                  '        this.persist();\n        this.control.assertAccount();\n        return response;',
                  '        if (transientAttempts > 0) this.metrics.recoveredTransientRequests++;\n        this.persist();\n        this.control.assertAccount();\n        return response;',
                  "recovered transient metric")

              s = once(s,
                  '  function missing(error) {\n    const status = error?.status ?? error?.response?.status;\n    const code = error?.body?.code ?? error?.response?.body?.code;\n    return status === 404 || code === 10008 || code === 10014;\n  }\n\n  async function deleteOne',
                  '  function missing(error) {\n    const status = error?.status ?? error?.response?.status;\n    const code = error?.body?.code ?? error?.response?.body?.code;\n    return status === 404 || code === 10008 || code === 10014;\n  }\n  function failureTaskKey(kind, item) {\n    return kind === "reaction"\n      ? `reaction:${item.channelId}:${item.messageId}:${item.emoji}:${item.userId ?? "@me"}`\n      : `message:${item.channelId}:${item.messageId}`;\n  }\n  function markTaskFailed(key) {\n    runtime.unresolvedFailures.add(key);\n    setProgress({ failed: runtime.unresolvedFailures.size });\n  }\n  function markTaskResolved(key) {\n    if (!runtime.unresolvedFailures.delete(key)) return;\n    setProgress({\n      failed: runtime.unresolvedFailures.size,\n      recoveredFailures: (progress.recoveredFailures ?? 0) + 1,\n    });\n  }\n\n  async function deleteOne',
                  "unresolved failure helpers")

              s = once(s,
                  '  async function deleteOne(rt, rate, control, message) {\n    await control.check();\n    try {',
                  '  async function deleteOne(rt, rate, control, message) {\n    await control.check();\n    const failureKey = failureTaskKey("message", message);\n    try {',
                  "delete failure key")

              s = once(s,
                  '      rate.metrics.finishTask("delete", 1, true);\n      bump({ messagesDeleted: 1 });\n      return true;',
                  '      rate.metrics.finishTask("delete", 1, true);\n      bump({ messagesDeleted: 1 });\n      markTaskResolved(failureKey);\n      return true;',
                  "delete resolve")

              s = once(s,
                  '      rate.metrics.finishTask("delete", 1);\n      bump(missing(error) ? { skipped: 1 } : { failed: 1 });\n      return false;',
                  '      rate.metrics.finishTask("delete", 1);\n      if (missing(error)) { markTaskResolved(failureKey); bump({ skipped: 1 }); }\n      else markTaskFailed(failureKey);\n      return false;',
                  "delete unresolved accounting")

              s = once(s,
                  '    for (const reaction of ordered) {\n      await control.check();\n      const encoded = encodeURIComponent(reaction.emoji);',
                  '    for (const reaction of ordered) {\n      await control.check();\n      const failureKey = failureTaskKey("reaction", reaction);\n      const encoded = encodeURIComponent(reaction.emoji);',
                  "reaction failure key")

              s = once(s,
                  '        rate.metrics.finishTask("reaction", 1);\n        bump({ reactionsRemoved: 1 });',
                  '        rate.metrics.finishTask("reaction", 1);\n        bump({ reactionsRemoved: 1 });\n        markTaskResolved(failureKey);',
                  "reaction resolve")

              s = once(s,
                  '        rate.metrics.finishTask("reaction", 1);\n        bump(missing(error) ? { skipped: 1 } : { failed: 1 });',
                  '        rate.metrics.finishTask("reaction", 1);\n        if (missing(error)) { markTaskResolved(failureKey); bump({ skipped: 1 }); }\n        else markTaskFailed(failureKey);',
                  "reaction unresolved accounting")

              s = once(s,
                  '    const control = new Control();\n    runtime.control = control;\n    progress = {',
                  '    const control = new Control();\n    runtime.control = control;\n    runtime.unresolvedFailures.clear();\n    progress = {',
                  "reset unresolved failures")

              s = once(s,
                  '        React.createElement(Txt, null, `Failures: ${report.failed}`),\n        React.createElement(Txt, { style: { fontWeight: "700", marginTop: 9 } }, "What it\'s doing"),',
                  '        React.createElement(Txt, null, `Failures: ${report.failed}`),\n        (report.transient_errors ?? 0) > 0 ? React.createElement(Txt, null, `Transient server errors: ${report.transient_errors} · recovered by retry: ${report.recovered_transient_requests ?? 0} · recovered later: ${report.recovered_failures ?? 0}`) : null,\n        React.createElement(Txt, { style: { fontWeight: "700", marginTop: 9 } }, "What it\'s doing"),',
                  "friendly transient status")

              path.write_text(s, encoding="utf-8")
          PY

      - name: Validate patched plugin
        run: |
          cmp plugins/purge-tools/index.js clients/shiggycord/plugins/purge-tools/index.js
          node --check plugins/purge-tools/index.js
          grep -q 'const PLUGIN_VERSION = "1.2.8-shiggy";' plugins/purge-tools/index.js
          grep -q 'const TRANSIENT_RETRIES = 2;' plugins/purge-tools/index.js
          grep -q 'transient_errors:' plugins/purge-tools/index.js
          grep -q 'unresolved_failures:' plugins/purge-tools/index.js
          grep -q 'runtime.unresolvedFailures.clear();' plugins/purge-tools/index.js
          ! grep -q 'const PLUGIN_VERSION = "1.2.7-shiggy";' plugins/purge-tools/index.js

      - name: Update manifests
        run: |
          HASH="$(git hash-object plugins/purge-tools/index.js)"
          export HASH
          python3 - <<'PY'
          import json, os
          for path in ["plugins/purge-tools/manifest.json", "clients/shiggycord/plugins/purge-tools/manifest.json"]:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              data["description"] = "ShiggyCord Purge Tools v1.2.8 with flattened runtime, conservative shared pacing, transient 5xx retry/recovery accounting, readable status UI, reusable previews, media protection, verification, and account-scoped resume checkpoints."
              data["hash"] = os.environ["HASH"]
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write("\n")
          PY
          cmp plugins/purge-tools/manifest.json clients/shiggycord/plugins/purge-tools/manifest.json
          test "$(python3 -c 'import json; print(json.load(open("plugins/purge-tools/manifest.json"))["hash"])')" = "$HASH"

      - name: Commit v1.2.8 staging release candidate
        run: |
          git config user.name "ItsTripleSix"
          git config user.email "onlytriplesix@protonmail.com"
          git add plugins/purge-tools/index.js plugins/purge-tools/manifest.json clients/shiggycord/plugins/purge-tools/index.js clients/shiggycord/plugins/purge-tools/manifest.json
          git diff --cached --check
          git commit -m "Purge Tools v1.2.8 transient recovery polish"
          git push origin HEAD:main
