name: Settings Pins v1.0.6 smoke
on:
  push:
    paths:
      - .github/workflows/settings-pins-v106-smoke.yml
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check plugins/settings-pins/index.js
          cmp plugins/settings-pins/index.js clients/shiggycord/plugins/settings-pins/index.js
          cmp plugins/settings-pins/manifest.json clients/shiggycord/plugins/settings-pins/manifest.json
          grep -q 'const VERSION = "1.0.6-shiggy";' plugins/settings-pins/index.js
          HASH="$(git hash-object plugins/settings-pins/index.js)"
          test "$HASH" = "c6d8a5a94c05a6c053021dc86fd26b1eec0fa188"
          test "$(python3 -c 'import json; print(json.load(open("plugins/settings-pins/manifest.json"))["hash"])')" = "$HASH"
          ! grep -q 'capturedSections' plugins/settings-pins/index.js
          ! grep -q 'patchSectionRefresh' plugins/settings-pins/index.js
