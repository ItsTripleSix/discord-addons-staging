name: Publish Settings Pins v1.0.8 existing shortcut controls

on:
  push:
    paths:
      - .github/workflows/settings-pins-v108-existing-shortcuts.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update plugin and docs
        run: |
          test "$(git hash-object plugins/settings-pins/index.js)" = "3dc1b9add13302d7dd159f1bbb58eb6e4f946246"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('plugins/settings-pins/index.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const VERSION = "1.0.7-shiggy";', 'const VERSION = "1.0.8-shiggy";')

          anchor = '  const STATE_VERSION = 1;\n\n  const rootNavigation'
          insert = '''  const STATE_VERSION = 1;\n  const CORE_ROW_KEYS = new Set([\n    "SHIGGYCORD",\n    "BUNNY_PLUGINS",\n    "BUNNY_THEMES",\n    "BUNNY_FONTS",\n    "BUNNY_DEVELOPER",\n  ]);\n  const originalExistingPredicates = new Map();\n\n  const rootNavigation'''
          if anchor not in s: raise SystemExit('state anchor missing')
          s = s.replace(anchor, insert, 1)

          anchor = '''  function setPinned(id, value) {\n    storage[pinStorageKey(id)] = !!value;\n  }\n\n'''
          insert = anchor + '''  function existingStorageKey(key) {\n    return `existing_${hashId(String(key))}`;\n  }\n\n  function isExistingVisible(key) {\n    return storage[existingStorageKey(key)] !== false;\n  }\n\n  function setExistingVisible(key, value) {\n    storage[existingStorageKey(key)] = !!value;\n  }\n\n'''
          if anchor not in s: raise SystemExit('setPinned anchor missing')
          s = s.replace(anchor, insert, 1)

          anchor = '''  function removeOurRows(rows) {\n    if (!Array.isArray(rows)) return;\n    for (let i = rows.length - 1; i >= 0; i--) {\n      if (String(rows[i]?.key ?? "").startsWith(KEY_PREFIX)) rows.splice(i, 1);\n    }\n  }\n\n'''
          insert = anchor + '''  function isExistingShortcutRow(row) {\n    const key = String(row?.key ?? "");\n    return !!key && !CORE_ROW_KEYS.has(key) && !key.startsWith(KEY_PREFIX);\n  }\n\n  function existingShortcutRows() {\n    return (shiggyRows() ?? []).filter(isExistingShortcutRow);\n  }\n\n  function wrapExistingShortcuts(rows = shiggyRows()) {\n    if (!Array.isArray(rows)) return;\n    for (const row of rows) {\n      if (!isExistingShortcutRow(row) || originalExistingPredicates.has(row)) continue;\n      const key = String(row.key);\n      const original = typeof row.usePredicate === "function" ? row.usePredicate : null;\n      originalExistingPredicates.set(row, original);\n      row.usePredicate = () => {\n        if (!isExistingVisible(key)) return false;\n        if (!original) return true;\n        try { return !!original(); }\n        catch { return false; }\n      };\n    }\n  }\n\n  function restoreExistingShortcuts() {\n    for (const [row, original] of originalExistingPredicates) {\n      try {\n        if (original) row.usePredicate = original;\n        else delete row.usePredicate;\n      } catch {}\n    }\n    originalExistingPredicates.clear();\n  }\n\n'''
          if anchor not in s: raise SystemExit('removeOurRows anchor missing')
          s = s.replace(anchor, insert, 1)

          anchor = '''  function syncPins() {\n    ensurePinState();\n    const rows = shiggyRows();\n    if (!rows) return false;\n\n    removeOurRows(rows);\n'''
          insert = '''  function syncPins() {\n    ensurePinState();\n    const rows = shiggyRows();\n    if (!rows) return false;\n\n    removeOurRows(rows);\n    wrapExistingShortcuts(rows);\n'''
          if anchor not in s: raise SystemExit('syncPins anchor missing')
          s = s.replace(anchor, insert, 1)

          anchor = '''  function Settings() {\n    ensurePinState();\n    const [, forceUpdate] = React.useReducer(value => value + 1, 0);\n'''
          insert = '''  function Settings() {\n    ensurePinState();\n    wrapExistingShortcuts();\n    const [, forceUpdate] = React.useReducer(value => value + 1, 0);\n'''
          if anchor not in s: raise SystemExit('Settings anchor missing')
          s = s.replace(anchor, insert, 1)

          anchor = '''    const plugins = Object.values(allPlugins())\n      .filter(plugin => plugin?.id && plugin?.manifest?.name)\n      .sort((a, b) => String(a.manifest.name).localeCompare(String(b.manifest.name)));\n\n'''
          insert = anchor + '''    const existing = existingShortcutRows();\n\n'''
          if anchor not in s: raise SystemExit('plugins list anchor missing')
          s = s.replace(anchor, insert, 1)

          anchor = '''      React.createElement(RN.Text, {\n        style: { color: C.muted, fontSize: 12, marginTop: 14 },\n      }, `v${VERSION}`),\n'''
          insert = '''      ...(existing.length ? [\n        React.createElement(RN.Text, {\n          key: "existing-shortcuts-title",\n          style: { color: C.text, fontSize: 17, fontWeight: "700", marginTop: 22, marginBottom: 4 },\n        }, "Already in ShiggyCord"),\n        React.createElement(RN.Text, {\n          key: "existing-shortcuts-note",\n          style: { color: C.muted, fontSize: 12, lineHeight: 17, marginBottom: 8 },\n        }, "These plugin shortcuts were already added to ShiggyCord. Turn one off to hide it, then use ReShiggy for the change to take effect."),\n        ...existing.map(row => {\n          const key = String(row.key);\n          let title = key;\n          try { title = String(row.title?.() ?? key); } catch {}\n          return React.createElement(RN.View, {\n            key: `existing-${key}`,\n            style: {\n              flexDirection: "row",\n              alignItems: "center",\n              justifyContent: "space-between",\n              paddingVertical: 14,\n              borderBottomWidth: 1,\n              borderBottomColor: C.border,\n            },\n          },\n          React.createElement(RN.View, { style: { flex: 1, paddingRight: 16 } },\n            React.createElement(RN.Text, {\n              style: { color: C.text, fontSize: 16, fontWeight: "600", marginBottom: 3 },\n            }, title),\n            React.createElement(RN.Text, {\n              style: { color: C.muted, fontSize: 12, lineHeight: 17 },\n            }, "Existing ShiggyCord shortcut"),\n          ),\n          React.createElement(RN.Switch, {\n            value: isExistingVisible(key),\n            onValueChange(value) {\n              setExistingVisible(key, value);\n              forceUpdate();\n            },\n          }));\n        }),\n      ] : []),\n      React.createElement(RN.Text, {\n        style: { color: C.muted, fontSize: 12, marginTop: 14 },\n      }, `v${VERSION}`),\n'''
          if anchor not in s: raise SystemExit('version anchor missing')
          s = s.replace(anchor, insert, 1)

          anchor = '''    onUnload() {\n      removeOurRows(shiggyRows());\n    },\n'''
          insert = '''    onUnload() {\n      restoreExistingShortcuts();\n      removeOurRows(shiggyRows());\n    },\n'''
          if anchor not in s: raise SystemExit('onUnload anchor missing')
          s = s.replace(anchor, insert, 1)

          p.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          marker = '| Silent Typing | plugins/silent-typing/ |\n\n'
          features = '''| Silent Typing | plugins/silent-typing/ |\n\n### Settings Pins features\n\n- Pin installed plugin settings directly into the ShiggyCord settings section.\n- Hide non-core plugin shortcuts that are already registered there, including bundled or hard-baked plugin entries.\n- Keep pin and visibility choices saved per plugin/shortcut.\n- Use ReShiggy after changing pins or existing-shortcut visibility for the main Settings list to rebuild.\n\n'''
          if marker not in r: raise SystemExit('README marker missing')
          r = r.replace(marker, features, 1)
          readme.write_text(r, encoding='utf-8')
          PY

          cp plugins/settings-pins/index.js clients/shiggycord/plugins/settings-pins/index.js
          node --check plugins/settings-pins/index.js
          cmp plugins/settings-pins/index.js clients/shiggycord/plugins/settings-pins/index.js
          grep -q 'const VERSION = "1.0.8-shiggy";' plugins/settings-pins/index.js
          grep -q 'Already in ShiggyCord' plugins/settings-pins/index.js
          grep -q 'CORE_ROW_KEYS' plugins/settings-pins/index.js
          grep -q 'restoreExistingShortcuts' plugins/settings-pins/index.js

          HASH="$(git hash-object plugins/settings-pins/index.js)"
          export HASH
          python3 - <<'PY'
          import json, os
          for path in ['plugins/settings-pins/manifest.json','clients/shiggycord/plugins/settings-pins/manifest.json']:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              data['description'] = "Pin plugin settings into ShiggyCord or hide existing non-core plugin shortcuts. Changes apply after ReShiggy."
              data['hash'] = os.environ['HASH']
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
                  f.write('\n')
          PY
          cmp plugins/settings-pins/manifest.json clients/shiggycord/plugins/settings-pins/manifest.json
          test "$(python3 -c 'import json; print(json.load(open("plugins/settings-pins/manifest.json"))["hash"])')" = "$HASH"
          git diff --check

      - name: Commit
        run: |
          git config user.name "ItsTripleSix"
          git config user.email "onlytriplesix@protonmail.com"
          git add plugins/settings-pins clients/shiggycord/plugins/settings-pins README.md
          git commit -m "Settings Pins v1.0.8 manage existing shortcuts"
          git push
