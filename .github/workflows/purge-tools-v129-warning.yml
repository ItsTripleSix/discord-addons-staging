name: Publish Purge Tools v1.2.9 warning

on:
  push:
    paths:
      - .github/workflows/purge-tools-v129-warning.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Purge Tools warning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          p = Path('plugins/purge-tools/index.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const PLUGIN_VERSION = "1.2.8-shiggy";', 'const PLUGIN_VERSION = "1.2.9-shiggy";')

          old = '''      React.createElement(Txt, { style: { color: C.muted, marginTop: 4, marginBottom: 12 } }, "Select DMs, channels, or entire servers. Every target has independent author, reaction, filter, and deletion-order settings."),\n\n'''
          new = old + '''      React.createElement(Card, { style: { borderColor: C.danger, marginBottom: 12 } },\n        React.createElement(Txt, { style: { color: C.danger, fontWeight: "800", fontSize: 16 } }, "Account risk — read before using"),\n        React.createElement(Txt, { style: { marginTop: 5, lineHeight: 19 } }, "Personally, Purge Tools has worked fine for me. Discord can still restrict or ban accounts for activity it considers abusive or automated. Use this tool at your own risk. I'm not responsible for account restrictions, suspensions, or bans."),\n      ),\n\n'''
          if old not in s:
              raise SystemExit('intro anchor missing')
          s = s.replace(old, new, 1)

          old = '''          `Permanently remove the selected messages/reactions from ${targets.length} target${targets.length === 1 ? "" : "s"}?${warnings.length ? `\\n\\nWARNING:\\n${warnings.join("\\n")}` : ""}${previewReady ? "\\n\\nThe completed preview snapshot will be used; initial discovery will be skipped." : ""}\\n\\nModerator actions are permission-checked per channel before requests are sent.`,\n'''
          new = '''          `Permanently remove the selected messages/reactions from ${targets.length} target${targets.length === 1 ? "" : "s"}?${warnings.length ? `\\n\\nWARNING:\\n${warnings.join("\\n")}` : ""}${previewReady ? "\\n\\nThe completed preview snapshot will be used; initial discovery will be skipped." : ""}\\n\\nACCOUNT RISK:\\nPurge Tools has worked fine for me, but use it at your own risk. I'm not responsible for account restrictions, suspensions, or bans.\\n\\nModerator actions are permission-checked per channel before requests are sent.`,\n'''
          if old not in s:
              raise SystemExit('confirm anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          Path('clients/shiggycord/plugins/purge-tools/index.js').write_text(s, encoding='utf-8')
          subprocess.run(['node','--check',str(p)], check=True)
          blob = subprocess.check_output(['git','hash-object',str(p)], text=True).strip()

          for mp in [Path('plugins/purge-tools/manifest.json'), Path('clients/shiggycord/plugins/purge-tools/manifest.json')]:
              data = json.loads(mp.read_text(encoding='utf-8'))
              data['description'] = 'ShiggyCord Purge Tools v1.2.9 with conservative shared pacing, transient 5xx retry/recovery accounting, previews, media protection, verification, account-scoped resume checkpoints, and prominent account-risk warnings.'
              data['hash'] = blob
              mp.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          assert Path('plugins/purge-tools/index.js').read_bytes() == Path('clients/shiggycord/plugins/purge-tools/index.js').read_bytes()
          assert Path('plugins/purge-tools/manifest.json').read_bytes() == Path('clients/shiggycord/plugins/purge-tools/manifest.json').read_bytes()
          print(blob)
          PY
          grep -q 'Account risk — read before using' plugins/purge-tools/index.js
          grep -q "I'm not responsible for account restrictions, suspensions, or bans" plugins/purge-tools/index.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "ItsTripleSix"
          git config user.email "onlytriplesix@protonmail.com"
          git add plugins/purge-tools clients/shiggycord/plugins/purge-tools
          git commit -m "Purge Tools v1.2.9 add account risk warning"
          git push
