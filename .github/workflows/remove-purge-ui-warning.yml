name: Remove Purge Tools in-app warning

on:
  push:
    paths:
      - .github/workflows/remove-purge-ui-warning.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove in-app warning and update manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          files = [
              Path('plugins/purge-tools/index.js'),
              Path('clients/shiggycord/plugins/purge-tools/index.js'),
          ]
          card_pattern = re.compile(
              r'\n\s*React\.createElement\(Card, \{ style: \{ borderColor: C\.danger, marginBottom: 12 \} \},\n'
              r'\s*React\.createElement\(Txt, \{ style: \{ color: C\.danger, fontWeight: "800", fontSize: 16 \} \}, "Account risk — read before using"\),\n'
              r'\s*React\.createElement\(Txt, \{ style: \{ marginTop: 5, lineHeight: 19 \} \}, "Personally, Purge Tools has worked fine for me\. Discord can still restrict or ban accounts for activity it considers abusive or automated\. Use this tool at your own risk\. I\'m not responsible for account restrictions, suspensions, or bans\."\),\n'
              r'\s*\),\n'
          )
          confirm = '\\n\\nACCOUNT RISK:\\nPurge Tools has worked fine for me, but use it at your own risk. I\'m not responsible for account restrictions, suspensions, or bans.\\n\\n'

          for path in files:
              s = path.read_text(encoding='utf-8')
              s, n = card_pattern.subn('\n', s, count=1)
              if n != 1:
                  raise SystemExit(f'{path}: expected one settings warning card, found {n}')
              if confirm not in s:
                  raise SystemExit(f'{path}: confirmation warning text not found')
              s = s.replace(confirm, '\\n\\n', 1)
              s, n = re.subn(r'const PLUGIN_VERSION = "[^"]+";', 'const PLUGIN_VERSION = "1.2.10-shiggy";', s, count=1)
              if n != 1:
                  raise SystemExit(f'{path}: version marker not found')
              path.write_text(s, encoding='utf-8')
              subprocess.run(['node', '--check', str(path)], check=True)
              manifest = path.with_name('manifest.json')
              data = json.loads(manifest.read_text(encoding='utf-8'))
              data['hash'] = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
              data['description'] = 'ShiggyCord Purge Tools with conservative shared pacing, transient 5xx retry/recovery accounting, previews, media protection, verification, and account-scoped resume checkpoints.'
              manifest.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

          cmp plugins/purge-tools/index.js clients/shiggycord/plugins/purge-tools/index.js
          cmp plugins/purge-tools/manifest.json clients/shiggycord/plugins/purge-tools/manifest.json
          ! grep -q 'Account risk — read before using' plugins/purge-tools/index.js
          ! grep -q 'ACCOUNT RISK:' plugins/purge-tools/index.js
          grep -q 'PLUGIN_VERSION = "1.2.10-shiggy"' plugins/purge-tools/index.js
          git diff --check

      - name: Commit correction
        run: |
          git config user.name "ItsTripleSix"
          git config user.email "onlytriplesix@protonmail.com"
          git add plugins/purge-tools clients/shiggycord/plugins/purge-tools
          git commit -m "Purge Tools v1.2.10-shiggy keep risk notice on GitHub only"
          git push
